    <!-- SCRIPT UTAMA & INDEXEDDB DENGAN PERSISTENT STORAGE -->
    <script>
        let db = null;

        async function requestPersistentStorage() {
            if (navigator.storage && navigator.storage.persist) {
                const isPersisted = await navigator.storage.persisted();
                if (!isPersisted) {
                    const result = await navigator.storage.persist();
                    console.log(`Izin Penyimpanan Permanen: ${result ? 'DISETUJUI' : 'DITOLAK'}`);
                } else {
                    console.log("Penyimpanan berstatus PERMANEN di memori internal.");
                }
            }
        }

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('DerimakasiiDB', 2);
                
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('incomes')) db.createObjectStore('incomes', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('expenses')) db.createObjectStore('expenses', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('menu')) db.createObjectStore('menu', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                };

                request.onsuccess = async function(e) {
                    db = e.target.result;
                    await requestPersistentStorage();
                    resolve(db);
                };

                request.onerror = function(e) {
                    console.error('IndexedDB Error:', e);
                    reject(e);
                };
            });
        }
    </script>
